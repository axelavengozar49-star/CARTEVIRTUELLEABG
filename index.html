<style>
  :root{
    /* Nuancier releve sur la carte imprimee ABG Peinture */
    --nuit:#1a211e;
    --nuit-fonce:#121714;
    --nuit-clair:#283430;
    --ardoise:#4a5257;
    --sauge:#8e9c94;
    --sable:#cdb98a;
    --bronze:#b08d57;
    --creme:#ede8df;
    --creme-pale:#e6dcc8;
    --fond:#d9d6cc;          /* le plan sur lequel la carte se pose */

    --cw: min(92vw, 560px, (100svh - 176px) * 1.5);

    --flip-duration:.62s;
    --flip-ease:cubic-bezier(.5,.12,.15,1);
    --serif:'Cormorant Garamond', Georgia, 'Times New Roman', serif;
    --sans:'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;

    --track-display:.26em;
    --track-label:.18em;
    --track-text:.03em;
  }
  @supports not (height: 100svh){
    :root{ --cw: min(92vw, 560px, (100vh - 176px) * 1.5); }
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  /* Fond : couleur pleine sur <html> (couvre tout l'ecran en toutes
     circonstances) + halo qui s'eteint en transparence, donc sans raccord. */
  html{
    height:100%;
    background-color:var(--fond);
  }
  body{
    position:fixed;
    inset:0;
    overflow:hidden;
    overscroll-behavior:none;
    background:transparent;
    color:var(--nuit);
    font-family:var(--sans);
    display:flex;
    align-items:center;
    justify-content:center;
    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;
    -webkit-touch-callout:none;
    -webkit-user-select:none;
    user-select:none;
    padding:
      max(16px, env(safe-area-inset-top))
      max(12px, env(safe-area-inset-right))
      max(16px, env(safe-area-inset-bottom))
      max(12px, env(safe-area-inset-left));
  }
  body::before{
    content:"";
    position:fixed;
    inset:-25%;
    z-index:0;
    pointer-events:none;
    background:radial-gradient(closest-side ellipse at 50% 42%,
      rgba(246,243,236,.95) 0%,
      rgba(240,236,228,.60) 38%,
      rgba(230,225,214,.26) 66%,
      rgba(225,220,209,0) 100%);
  }

  img{ -webkit-user-drag:none; user-select:none; pointer-events:none; }

  .stage{
    position:absolute;
    inset:0;
    z-index:1;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .deck{ position:relative; width:var(--cw); aspect-ratio:3 / 2; }
  .deck .card-frame{
    position:absolute;
    inset:0;
    width:100%;
    opacity:0;
    transform:scale(.94);
    pointer-events:none;
    transition:opacity .34s ease, transform .34s cubic-bezier(.3,.7,.3,1);
    perspective:1800px;
    touch-action:none;
    cursor:grab;
    outline:none;
  }
  .deck .card-frame.is-active{ opacity:1; transform:none; pointer-events:auto; }
  .card-frame:active{ cursor:grabbing; }
  .card-frame:focus-visible .face{ box-shadow:0 0 0 3px var(--bronze); }

  .card-inner{
    position:relative;
    width:100%;
    height:100%;
    transform-style:preserve-3d;
    transform:rotateY(0deg);
    transition:transform var(--flip-duration) var(--flip-ease);
  }
  .card-inner.dragging{ transition:none; }
  .card-inner.is-flipped{ transform:rotateY(180deg); }

  .face{
    position:absolute;
    inset:0;
    border-radius:calc(var(--cw) * .045);
    overflow:hidden;
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
    background:var(--creme);
    color:var(--nuit);
    box-shadow:
      0 calc(var(--cw)*.045) calc(var(--cw)*.075) rgba(74,82,87,.30),
      inset 0 0 0 1px rgba(26,33,30,.10);
  }
  .face--back{ transform:rotateY(180deg); }

  /* ---------- Le nuancier, signature de la marque ----------
     Bande verticale a droite sur la face d'identite, comme le recto
     imprime ; bande horizontale en pied sur les faces QR, comme le verso. */
  .nuancier{ position:absolute; display:flex; z-index:2; }
  .nuancier span{ flex:1; }
  .nuancier--droite{
    top:0; right:0; bottom:0;
    width:5.5%;
    flex-direction:column;
  }
  .nuancier--bas{
    left:0; right:0; bottom:0;
    height:7%;
    flex-direction:row;
  }

  .face-content{
    position:relative;
    z-index:1;
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    gap:calc(var(--cw) * .016);
    padding:calc(var(--cw) * .045) calc(var(--cw) * .10) calc(var(--cw) * .045) calc(var(--cw) * .055);
  }
  .face--qr .face-content{
    gap:calc(var(--cw) * .015);
    padding:calc(var(--cw) * .040) calc(var(--cw) * .06) calc(var(--cw) * .068);
  }

  /* ---------- Face identite ---------- */
  .sceau{
    height:calc(var(--cw) * .205);
    width:auto;
    display:block;
  }
  .nom{
    font-family:var(--serif);
    font-weight:400;
    font-size:calc(var(--cw) * .070);
    letter-spacing:.05em;
    line-height:1.1;
    color:var(--nuit);
    white-space:nowrap;
  }
  .role{
    font-family:var(--sans);
    font-weight:500;
    font-size:calc(var(--cw) * .024);
    letter-spacing:var(--track-display);
    text-transform:uppercase;
    color:var(--bronze);
  }
  .rule{
    width:28%;
    height:1px;
    background:linear-gradient(90deg, transparent, var(--bronze), transparent);
    margin:calc(var(--cw) * .010) 0;
  }
  .contact{
    display:flex;
    flex-wrap:wrap;
    align-items:baseline;
    justify-content:center;
    gap:0 calc(var(--cw) * .022);
    font-family:var(--sans);
    font-weight:400;
    font-size:calc(var(--cw) * .028);
    letter-spacing:var(--track-text);
    line-height:1.5;
    color:var(--nuit);
    white-space:nowrap;
  }
  .contact .tel{ font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1; }
  .contact .sep{ color:var(--bronze); }
  .site{
    font-family:var(--sans);
    font-weight:400;
    font-size:calc(var(--cw) * .026);
    letter-spacing:var(--track-text);
    color:var(--ardoise);
  }

  /* ---------- Faces QR ---------- */
  .headline{
    font-family:var(--sans);
    font-weight:600;
    font-size:calc(var(--cw) * .030);
    letter-spacing:var(--track-label);
    text-transform:uppercase;
    color:var(--bronze);
  }
  /* Le code est deja imprime sur creme, il se pose donc a meme la carte,
     comme sur le verso papier : pas de cartouche blanc rapporte. */
  .qr{
    display:block;
    width:calc(var(--cw) * var(--qr));
    height:calc(var(--cw) * var(--qr));
    border-radius:calc(var(--cw) * .012);
  }
  .face--vcard{ --qr:.46; }
  .face--avis{ --qr:.44; }

  .scan-caption{
    font-family:var(--sans);
    font-weight:400;
    font-size:calc(var(--cw) * .027);
    letter-spacing:var(--track-text);
    color:var(--ardoise);
  }
  .stars{
    color:var(--bronze);
    font-size:calc(var(--cw) * .036);
    letter-spacing:var(--track-display);
    line-height:1;
  }

  /* ---------- Barre du bas ---------- */
  .bottom-bar{
    position:absolute;
    left:0; right:0;
    bottom:max(18px, calc(env(safe-area-inset-bottom) + 10px));
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    z-index:2;
  }
  .hint{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:clamp(11px, calc(var(--cw) * .032), 14px);
    color:var(--ardoise);
    opacity:.9;
    transition:opacity .5s ease;
  }
  .hint.faded{ opacity:.35; }
  .hint .arrows{ display:inline-block; font-size:1.2em; animation:nudge 1.9s ease-in-out infinite; }
  @keyframes nudge{ 0%,100%{transform:translateX(0);} 50%{transform:translateX(-5px);} }

  .switch{
    display:flex;
    gap:4px;
    padding:4px;
    border-radius:999px;
    background:rgba(26,33,30,.05);
    box-shadow:inset 0 0 0 1px rgba(176,141,87,.35);
  }
  .switch button{
    -webkit-appearance:none; appearance:none; border:0; cursor:pointer;
    font-family:var(--sans);
    font-weight:500;
    font-size:13px;
    letter-spacing:.04em;
    padding:9px 18px;
    border-radius:999px;
    background:transparent;
    color:var(--ardoise);
    transition:background .25s ease, color .25s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .switch button[aria-pressed="true"]{
    background:linear-gradient(135deg, var(--sable), var(--bronze));
    color:var(--nuit);
  }
  .switch button:focus-visible{ outline:2px solid var(--bronze); outline-offset:3px; }

  /* Telephone a l'horizontale : mode presentation. */
  @media (orientation: landscape) and (max-height: 460px){
    :root{ --cw: min(94vw, 620px, (100svh - 104px) * 1.5); }
    .hint{ display:none; }
    .switch button{ font-size:12px; padding:7px 15px; }
    .bottom-bar{ gap:0; bottom:max(12px, calc(env(safe-area-inset-bottom) + 6px)); }
    .stage{ padding-bottom:52px; }
  }
  @supports not (height: 100svh){
    @media (orientation: landscape) and (max-height: 460px){
      :root{ --cw: min(94vw, 620px, (100vh - 104px) * 1.5); }
    }
  }

  @media (prefers-reduced-motion: reduce){
    .card-inner{ transition-duration:.001s; }
    .hint .arrows{ animation:none; }
  }
</style>
</head>
<body>

<div class="stage">
  <div class="deck" id="deck">

    <div class="card-frame is-active" data-carte="contacts" tabindex="0" role="button">

    </div>

<script>
(function(){
  var cartes   = [].slice.call(document.querySelectorAll('#deck .card-frame'));
  var boutons  = [].slice.call(document.querySelectorAll('.switch button'));
  var hint     = document.getElementById('hint');
  var hintText = document.getElementById('hintText');

  var TEXTES = {
    contacts: {
      avant:'Glissez pour ajouter aux contacts',
      arriere:'Glissez pour revenir à la carte',
      labelAvant:'Carte ABG Peinture, recto affiché. Glissez ou appuyez sur Entrée pour afficher le QR code des coordonnées.',
      labelArriere:'Carte ABG Peinture, QR code des coordonnées affiché. Glissez ou appuyez sur Entrée pour revenir au recto.'
    },
    avis: {
      avant:'Glissez pour laisser un avis',
      arriere:'Glissez pour revenir à la carte',
      labelAvant:'Carte avis Google ABG Peinture, recto affiché. Glissez ou appuyez sur Entrée pour afficher le QR code d’avis.',
      labelArriere:'Carte avis Google ABG Peinture, QR code affiché. Glissez ou appuyez sur Entrée pour revenir au recto.'
    }
  };

  var actif = 0, interagi = false;
  function clamp(v,lo,hi){ return v<lo?lo:(v>hi?hi:v); }

  function majIndication(){
    var c = cartes[actif], t = TEXTES[c.dataset.carte];
    hintText.textContent = c.retournee ? t.arriere : t.avant;
    c.setAttribute('aria-label', c.retournee ? t.labelArriere : t.labelAvant);
  }
  /* Safari peut ignorer backface-visibility des qu'un effet aplatit la
     scene 3D : on masque donc explicitement la face qui tourne le dos. */
  function montrer(c, verso){
    if(c.verso === verso) return;
    c.verso = verso;
    c.querySelector('.face--front').style.visibility = verso ? 'hidden' : 'visible';
    c.querySelector('.face--back').style.visibility  = verso ? 'visible' : 'hidden';
  }

  function retourner(c, v){
    c.retournee = v;
    var inner = c.querySelector('.card-inner');
    inner.classList.toggle('is-flipped', v);
    /* La bascule se fait a mi-course, quand la carte est sur la tranche. */
    clearTimeout(c.minuteur);
    var duree = (parseFloat(getComputedStyle(inner).transitionDuration) || 0) * 1000;
    if(duree < 40) montrer(c, v);
    else c.minuteur = setTimeout(function(){ montrer(c, v); }, duree / 2);
    majIndication();
    if(!interagi){ interagi = true; hint.classList.add('faded'); }
  }
  function choisir(i){
    actif = i;
    cartes.forEach(function(c,j){
      var on = (j===i);
      c.classList.toggle('is-active', on);
      c.setAttribute('tabindex', on ? '0' : '-1');
      if(on) c.removeAttribute('aria-hidden'); else c.setAttribute('aria-hidden','true');
    });
    boutons.forEach(function(b,j){ b.setAttribute('aria-pressed', j===i ? 'true' : 'false'); });
    majIndication();
  }
  boutons.forEach(function(b,i){ b.addEventListener('click', function(){ choisir(i); }); });

  cartes.forEach(function(carte){
    carte.retournee = false;
    carte.verso = null;
    montrer(carte, false);
    var enCours=false, dx=0, departX=0, departY=0, axe=null, facteur=1;

    function debut(x,y){
      clearTimeout(carte.minuteur);
      enCours=true; axe=null; departX=x; departY=y; dx=0;
      facteur = 220 / carte.getBoundingClientRect().width;
      carte.querySelector('.card-inner').classList.add('dragging');
    }
    function bouge(x,y){
      if(!enCours) return;
      var mx=x-departX, my=y-departY;
      if(axe===null && (Math.abs(mx)>6 || Math.abs(my)>6)) axe = Math.abs(mx)>Math.abs(my)?'x':'y';
      if(axe!=='x') return;
      dx=mx;
      var a = clamp((carte.retournee?180:0) - dx*facteur, 0, 180);
      carte.querySelector('.card-inner').style.transform = 'rotateY('+a+'deg)';
      montrer(carte, a > 90);
    }
    function fin(){
      if(!enCours) return;
      enCours=false;
      var inner = carte.querySelector('.card-inner');
      inner.classList.remove('dragging');
      inner.style.transform='';
      if(axe!=='x'){ if(Math.abs(dx)<6) retourner(carte, !carte.retournee); axe=null; return; }
      var a = clamp((carte.retournee?180:0) - dx*facteur, 0, 180);
      if(Math.abs(dx)<6) retourner(carte, !carte.retournee); else retourner(carte, a>90);
      axe=null;
    }

    if(window.PointerEvent){
      carte.addEventListener('pointerdown', function(e){
        if(carte.setPointerCapture) carte.setPointerCapture(e.pointerId);
        debut(e.clientX, e.clientY);
      });
      carte.addEventListener('pointermove', function(e){ bouge(e.clientX, e.clientY); });
      carte.addEventListener('pointerup', fin);
      carte.addEventListener('pointercancel', fin);
    } else {
      carte.addEventListener('touchstart', function(e){ var t=e.changedTouches[0]; debut(t.clientX,t.clientY); }, {passive:true});
      carte.addEventListener('touchmove', function(e){ var t=e.changedTouches[0]; bouge(t.clientX,t.clientY); if(axe==='x') e.preventDefault(); }, {passive:false});
      carte.addEventListener('touchend', fin);
      carte.addEventListener('touchcancel', fin);
      carte.addEventListener('click', function(){ retourner(carte, !carte.retournee); });
    }

    carte.addEventListener('keydown', function(e){
      if(e.key==='Enter' || e.key===' '){ e.preventDefault(); retourner(carte, !carte.retournee); }
      else if(e.key==='ArrowLeft'){ e.preventDefault(); retourner(carte, true); }
      else if(e.key==='ArrowRight'){ e.preventDefault(); retourner(carte, false); }
    });
  });

  var dernier = 0;
  document.addEventListener('touchend', function(e){
    var n = Date.now();
    if(n - dernier < 350) e.preventDefault();
    dernier = n;
  }, {passive:false});

  choisir(0);
})();
</script>
